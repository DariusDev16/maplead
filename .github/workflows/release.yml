name: Release

# Bump VERSION in maplead/art.py, tag, push:
#   git tag v1.1.0 && git push origin v1.1.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    name: build AppImage (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system packages for the Qt xcb platform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1 fuse libfuse2 desktop-file-utils

      - name: build + smoke test
        run: ./build-appimage.sh --no-test

      - name: run the built image
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="$(ls "$HOME/Apps"/MAPLEAD-*.AppImage | head -1)"
          chmod +x "$APP"
          "$APP" --selftest
          # the same file must also run the terminal wizard
          "$APP" --cli --version
          "$APP" --cli --demo --country Germany --city Berlin --business dentist \
            --fields rec --limit 5 --format csv --outdir "$RUNNER_TEMP/cli-leads"

      - name: describe
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP="$(ls "$HOME/Apps"/MAPLEAD-*.AppImage | head -1)"
          echo "name=MAPLEAD $TAG (x86_64)" >> "$GITHUB_OUTPUT"
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            Linux x86_64 AppImage and Windows x64 portable ZIP of MAPLEAD.

            **Linux**

            ```bash
            chmod +x MAPLEAD-*-x86_64.AppImage
            ./MAPLEAD-*-x86_64.AppImage
            ```

            If your system has no `libfuse.so.2`, run it with
            `APPIMAGE_EXTRACT_AND_RUN=1` — it unpacks itself into `~/.maplead-runtime/`
            and runs from there.

            **Windows 10/11 x64**

            ```powershell
            Expand-Archive MAPLEAD-*-win64.zip -DestinationPath "$env:LOCALAPPDATA\Programs"
            cd "$env:LOCALAPPDATA\Programs\MAPLEAD"
            powershell -ExecutionPolicy Bypass -File .\install.ps1
            ```

            Or skip `install.ps1` and run `MAPLEAD.exe` straight from the folder. The
            build is unsigned, so SmartScreen asks once: *More info → Run anyway*.

            The user guide covers the rest:
            https://github.com/${{ github.repository }}/blob/main/docs/GUIDE.md
          files: ${{ steps.meta.outputs.path }}

  windows:
    name: build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build + smoke test
        run: .\build-windows.ps1

      - name: describe
        id: meta
        shell: pwsh
        run: |
          $version = (Select-String -Path maplead\art.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $zip = Join-Path $env:USERPROFILE "Apps\MAPLEAD-$version-win64.zip"
          if (-not (Test-Path $zip)) { throw "the build produced no ZIP" }
          "path=$zip" >> $env:GITHUB_OUTPUT
          "name=$version" >> $env:GITHUB_OUTPUT

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.meta.outputs.path }}