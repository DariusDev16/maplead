name: Release

# Bump VERSION in maplead/art.py, tag, push:
#   git tag v1.2.0 && git push origin v1.2.0

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    name: build AppImage (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system packages for the Qt xcb platform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1 fuse libfuse2 desktop-file-utils

      - name: build + smoke test
        run: ./build-appimage.sh --no-test

      - name: run the built image
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="$(ls "$HOME/Apps"/MAPLEAD-*.AppImage | head -1)"
          chmod +x "$APP"
          "$APP" --selftest
          # the same file must also run the terminal wizard
          "$APP" --cli --version
          "$APP" --cli --demo --country Germany --city Berlin --business dentist \
            --fields rec --limit 5 --format csv --outdir "$RUNNER_TEMP/cli-leads"

      - name: describe
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP="$(ls "$HOME/Apps"/MAPLEAD-*.AppImage | head -1)"
          echo "name=MAPLEAD $TAG" >> "$GITHUB_OUTPUT"
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            One AppImage for Linux, one portable .exe for Windows. Both are the whole
            product: the desktop window and the terminal wizard in a single file.

            **Highlights in 1.2.0**

            - Leads panel with one-click website, Maps, e-mail and social links.
            - WhatsApp buttons with a saved first-message template (`{nome}`,
              `{cidade}`, `{site}` and more resolved from the scraped lead).
            - Explicit **Export** (`Ctrl+S`): a search never writes a file by itself.
            - Export filenames follow the latest business + city, with accents
              transliterated (`São Paulo` → `sao-paulo`).
            - Dark → light → dark theme toggling fixed.

            Full notes: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md

            **Linux x86_64**

            ```bash
            chmod +x MAPLEAD-*-x86_64.AppImage
            ./MAPLEAD-*-x86_64.AppImage              # desktop app
            ./MAPLEAD-*-x86_64.AppImage --cli --demo # terminal wizard
            ```

            If your system has no `libfuse.so.2`, run it with
            `APPIMAGE_EXTRACT_AND_RUN=1` — it unpacks itself into `~/.maplead-runtime/`
            and runs from there.

            **Windows 10/11 x64**

            Download `MAPLEAD-*-windows-x64.exe` and double-click it. Nothing to unpack,
            nothing to install. The same file is the terminal wizard:

            ```powershell
            .\MAPLEAD-*-windows-x64.exe --cli --demo      # guided wizard, no key needed
            .\MAPLEAD-*-windows-x64.exe --cli --doctor    # host diagnostics
            ```

            The build is unsigned, so SmartScreen asks once: *More info → Run anyway*.

            The user guide covers the rest:
            https://github.com/${{ github.repository }}/blob/main/docs/GUIDE.md
          files: ${{ steps.meta.outputs.path }}

  windows:
    name: build Windows x64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build + smoke test
        run: .\build-windows.ps1

      - name: describe
        id: meta
        shell: pwsh
        run: |
          $version = (Select-String -Path maplead\art.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $exe = Join-Path $env:USERPROFILE "Apps\MAPLEAD-$version-windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "the build produced no .exe" }
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.meta.outputs.path }}