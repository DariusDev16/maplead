name: Build (Windows)

# PyInstaller cannot cross-compile, so the Windows build needs a Windows runner.
# Push this branch or run it manually to produce the exe; tags attach it to a
# release like the Linux AppImage does.

on:
  push:
    branches: [main, windows-build]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: build exe (windows x64)
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build + self-test
        shell: pwsh
        run: |
          .\build-windows.ps1
          Get-ChildItem release | Format-Table Name, Length

      - name: upload the zip
        uses: actions/upload-artifact@v4
        with:
          name: MAPLEAD-windows-x64
          path: release/*.zip
          if-no-files-found: error

      - name: attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        run: gh release upload $env:GITHUB_REF_NAME release/*.zip --clobber --repo $env:GITHUB_REPOSITORY
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}