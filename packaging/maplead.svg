<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0f1b33"/>
      <stop offset="1" stop-color="#13294d"/>
    </linearGradient>
    <linearGradient id="pin" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#0ea5e9"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- soft glow -->
  <circle cx="256" cy="228" r="150" fill="#0ea5e9" opacity="0.10"/>

  <!-- map pin -->
  <path d="M256 96c-74 0-134 60-134 134 0 98 134 206 134 206s134-108 134-206c0-74-60-134-134-134z"
        fill="url(#pin)"/>
  <circle cx="256" cy="230" r="52" fill="#0b1120" opacity="0.92"/>
  <!-- signal waves inside the pin hole -->
  <g stroke="#7dd3fc" stroke-width="13" stroke-linecap="round" fill="none">
    <path d="M226 244a44 44 0 0 1 60 0"/>
    <path d="M206 222a74 74 0 0 1 100 0"/>
  </g>
  <circle cx="256" cy="268" r="13" fill="#7dd3fc"/>

  <!-- three extracted lead rows -->
  <g fill="#38bdf8">
    <rect x="96" y="398" width="150" height="16" rx="8" opacity="0.85"/>
    <rect x="266" y="398" width="150" height="16" rx="8" opacity="0.55"/>
    <rect x="96" y="430" width="196" height="16" rx="8" opacity="0.45"/>
    <rect x="312" y="430" width="104" height="16" rx="8" opacity="0.30"/>
  </g>
</svg>