name: Release

# Bump VERSION in maplead/art.py, tag, push:
#   git tag v1.4.1 && git push origin v1.4.1
#
# A tag push builds the Linux AppImage only. The Windows job runs when the
# workflow is started by hand (workflow_dispatch).

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "tag to build (e.g. v1.0.0)"
        required: true

permissions:
  contents: write

jobs:
  appimage:
    name: build AppImage (linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system packages for the Qt xcb platform
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libglib2.0-0 libegl1 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1 fuse libfuse2 desktop-file-utils \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libasound2

      - name: build + smoke test
        run: ./build-appimage.sh --no-test

      - name: run the built image
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          APP="$(ls "$HOME/Apps"/MAPLEAD-*.AppImage | head -1)"
          chmod +x "$APP"
          "$APP" --selftest
          # the same file must also run the terminal wizard
          "$APP" --cli --version
          "$APP" --cli --demo --country Germany --city Berlin --business dentist \
            --fields rec --limit 5 --format csv --outdir "$RUNNER_TEMP/cli-leads"

      - name: describe
        id: meta
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          APP="$(ls "$HOME/Apps"/MAPLEAD-*.AppImage | head -1)"
          echo "name=MAPLEAD $TAG" >> "$GITHUB_OUTPUT"
          echo "path=$APP" >> "$GITHUB_OUTPUT"

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          name: ${{ steps.meta.outputs.name }}
          body: |
            **MAPLEAD 1.4.1 — sending no longer stops at the "not on WhatsApp" popup (Linux)**

            **What's fixed**

            - **Bulk send** and **Turbo mode** no longer wait for you to click the popup
              WhatsApp shows for a number that has no account. The lead is marked
              *Not on WhatsApp*, the popup is closed and the run goes on to the next lead.
            - More wordings of that popup are recognised, and any other popup that keeps
              the chat from opening is handled the same way after a few seconds; its text
              is written to the activity log.

            New in 1.4.0: **Turbo mode** searches city by city and business by business,
            and messages every lead that passes your filter.

            Full notes: https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md ·
            guide: https://github.com/${{ github.repository }}/blob/main/docs/GUIDE.md

            **Linux x86_64**

            ```bash
            chmod +x MAPLEAD-*-x86_64.AppImage
            ./MAPLEAD-*-x86_64.AppImage              # desktop app
            ./MAPLEAD-*-x86_64.AppImage --cli --demo # terminal wizard
            ```

            If your system has no `libfuse.so.2`, run it with
            `APPIMAGE_EXTRACT_AND_RUN=1` — it unpacks itself into `~/.maplead-runtime/`
            and runs from there.

            Windows: this release has no new `.exe`; keep using 1.2.0 for now.

            > Automated WhatsApp messages go against WhatsApp's terms of service. The
            > pauses lower the risk of the number being restricted; they do not remove it.
          files: ${{ steps.meta.outputs.path }}

  windows:
    name: build Windows x64
    # 1.4.0 ships for Linux only; build Windows by starting the workflow by hand
    if: github.event_name == 'workflow_dispatch'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: build + smoke test
        run: .\build-windows.ps1

      - name: describe
        id: meta
        shell: pwsh
        run: |
          $version = (Select-String -Path maplead\art.py -Pattern 'VERSION = "([^"]+)"').Matches[0].Groups[1].Value
          $exe = Join-Path $env:USERPROFILE "Apps\MAPLEAD-$version-windows-x64.exe"
          if (-not (Test-Path $exe)) { throw "the build produced no .exe" }
          "path=$exe" >> $env:GITHUB_OUTPUT

      - name: attach to the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag || github.ref_name }}
          files: ${{ steps.meta.outputs.path }}