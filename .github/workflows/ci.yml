name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  terminal:
    name: terminal wizard (no dependencies)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: compile every module
        run: python -m compileall -q maplead

      - name: the CLI must run with nothing installed
        run: |
          python -m pip list --format=freeze | grep -qi pyside && { echo "PySide6 leaked into the CLI path"; exit 1; } || true
          python maplead.py --version
          python maplead.py --demo --country Germany --city Berlin \
            --business dentist --fields rec --limit 60 --format xlsx \
            --min-rating 4.0 --outdir /tmp/maplead-ci
          ls -l /tmp/maplead-ci

      - name: introspection still works
        run: |
          python maplead.py --list-providers
          python maplead.py --list-fields --provider google

  desktop:
    name: desktop app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: system libraries Qt needs at runtime
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libglib2.0-0 libxkbcommon-x11-0 libxcb-cursor0 \
            libdbus-1-3 libfontconfig1

      - name: install GUI dependencies
        run: python -m pip install -q "PySide6-Essentials>=6.8" pyflakes

      - name: lint (unused imports / undefined names)
        run: python -m pyflakes maplead tools

      - name: headless self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python maplead-gui.py --selftest

  windows:
    name: windows (one .exe, both interfaces)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: install GUI dependencies
        run: python -m pip install -q "PySide6-Essentials>=6.8" pyflakes

      - name: lint (unused imports / undefined names)
        run: python -m pyflakes maplead tools

      - name: the wizard runs on a bare Windows Python
        shell: pwsh
        run: |
          python maplead.py --version
          python maplead.py --demo --country Germany --city Berlin `
            --business dentist --fields rec --limit 60 --format xlsx `
            --min-rating 4.0 --outdir "$env:TEMP\maplead-ci"
          Get-ChildItem "$env:TEMP\maplead-ci"

      - name: introspection still works
        run: |
          python maplead.py --list-providers
          python maplead.py --list-fields --provider google

      - name: headless self-test
        env:
          QT_QPA_PLATFORM: offscreen
        run: python maplead-gui.py --selftest

      - name: build the single .exe
        run: .\build-windows.ps1 -NoTest

      - name: smoke-test the frozen build
        shell: pwsh
        run: |
          $exe = (Resolve-Path .\dist\MAPLEAD.exe).Path
          & $exe --version
          if ($LASTEXITCODE -ne 0) { throw "MAPLEAD.exe --version failed" }
          & $exe --doctor
          if ($LASTEXITCODE -ne 0) { throw "MAPLEAD.exe --doctor failed" }
          & $exe --cli --demo --country Germany --city Berlin `
            --business dentist --fields rec --limit 20 --format csv `
            --outdir "$env:TEMP\maplead-frozen"
          if ($LASTEXITCODE -ne 0) { throw "the wizard inside the .exe failed" }
          $proc = Start-Process -FilePath $exe -ArgumentList "--selftest" -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "frozen desktop self-test failed" }

      - name: collect the .exe
        shell: pwsh
        run: Copy-Item "$env:USERPROFILE\Apps\MAPLEAD-*-windows-x64.exe" .

      - uses: actions/upload-artifact@v4
        with:
          name: MAPLEAD-windows
          path: MAPLEAD-*-windows-x64.exe
          if-no-files-found: error